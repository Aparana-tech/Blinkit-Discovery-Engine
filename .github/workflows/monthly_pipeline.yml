name: Monthly AI Discovery Pipeline

on:
  schedule:
    # Runs at 00:00 (UTC) on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Monthly AI Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/main.py --run-all

      - name: Commit and Push new Insights (Optional)
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/processed/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update monthly AI insights [skip ci]"
          git push
