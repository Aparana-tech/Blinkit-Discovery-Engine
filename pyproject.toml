[project]
name = "blinkit-discovery-engine"
version = "0.1.0"
description = "AI-powered review analysis system for Blinkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-play-scraper>=1.2.4",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "groq>=1.5.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.1",
    "sentence-transformers>=2.5.1",
    "spacy>=3.7.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
